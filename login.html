<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AgapAlert</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

<main class="auth">
  <section class="auth-brand">
    <a class="brand" href="login.html">
      <img src="assets/img/logo.png" alt="" width="36" height="36">AgapAlert
    </a>
    <div>
      <h1>Know the river's level <em>before</em> it reaches your street.</h1>
      <p>Live gauge readings, evacuation center capacity and SOS reports for Philippine barangays along flood-prone river basins.</p>
    </div>

    <figure class="gauge" aria-label="River gauge for Sinocalan River - Santa Barbara Bridge Gauge">
      <div class="gauge-tube">
        <div class="gauge-fill gauge-warn" style="height: 74%"></div>
        <span class="gauge-line gauge-line-alert" style="bottom: 66%"></span>
        <span class="gauge-line gauge-line-crit"  style="bottom: 87%"></span>
      </div>
      <div class="gauge-scale">
        <span style="bottom: 87%">Critical 6.80 m</span>
        <span style="bottom: 66%">Alert 5.20 m</span>
        <span style="bottom: 0">0 m</span>
      </div>
      <figcaption>
        <strong class="gauge-reading gauge-text-warn">5.82 m</strong>
        <span>Above alert level, rising at 0.18 m/h</span>
        <small>Sinocalan River - Santa Barbara Bridge Gauge</small>
      </figcaption>
    </figure>
  </section>

  <section class="auth-form">
    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="sub">Residents and barangay officials use the same sign-in.</p>

      <div id="login-error" class="notice notice-error" role="alert" style="display:none"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
          </div>
          <a class="forgot-password" href="forgot-password.html">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
    </div>
  </section>
</main>

<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
